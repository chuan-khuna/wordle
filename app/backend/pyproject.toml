[project]
name = "wordle-backend"
version = "0.1.0"
description = "The FastAPI app behind the Wordle website: Feedback, Candidates and the Solver."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.150.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "wordle",
]

[tool.uv.sources]
wordle = { path = "../../packages/wordle", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]


