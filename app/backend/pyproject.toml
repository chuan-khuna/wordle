[project]
name = "wordle-backend"
version = "0.1.0"
description = "The Flask API behind the Wordle website: Feedback, Candidates and the Solver."
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.0",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]


