[project]
name = "wordle"
version = "0.1.0"
description = "An interactive Wordle game: the Answer and Guess Lists, Feedback, and a terminal Game."
requires-python = ">=3.14"
dependencies = [
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "numpy>=2.5.4",
    "tqdm>=4.70.1",
]

[project.scripts]
wordle = "wordle.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"
